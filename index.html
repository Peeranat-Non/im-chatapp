<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instant Messaging App</title>

  <!-- Tailwind CSS ผ่าน CDN สำหรับจัดหน้าตา UI -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Socket.io client library: ทำให้หน้าเว็บนี้คุยกับ server ผ่าน WebSocket ได้ -->
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-800 h-screen flex items-center justify-center font-sans">

  <!-- ========================= -->
  <!-- SCREEN 1: Join Chatroom   -->
  <!-- ========================= -->
  <div id="join-screen" class="bg-gradient-to-br from-blue-500 to-green-600 rounded-xl p-8 w-80 shadow-2xl">
    <h1 class="text-white text-xl font-bold mb-6">Join Chatroom</h1>
    <input
      id="username-input"
      type="text"
      placeholder="Username"
      class="w-full mb-4 px-3 py-2 rounded bg-gray-900 text-white border border-gray-600 focus:outline-none focus:border-green-400"
    />
    <button
      id="join-btn"
      class="w-full py-2 rounded bg-gray-900 text-white font-bold border-2 border-green-400 hover:bg-gray-700 transition"
    >
      Join
    </button>
    <p id="join-error" class="text-red-200 text-sm mt-3 hidden">กรุณากรอก Username ก่อนเข้าห้องแชท</p>
  </div>

  <!-- ========================= -->
  <!-- SCREEN 2: Chat Room       -->
  <!-- ========================= -->
  <div id="chat-screen" class="hidden bg-gradient-to-br from-blue-500 to-green-600 rounded-xl w-96 h-[600px] shadow-2xl flex flex-col overflow-hidden">

    <!-- Header -->
    <div class="bg-gray-900 flex items-center justify-between px-4 py-3">
      <h2 class="text-white font-bold">Message</h2>
      <span id="online-count" class="text-green-400 text-xs">online: 0</span>
    </div>

    <!-- ข้อความ -->
    <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-2"></div>

    <!-- สถานะกำลังพิมพ์ -->
    <div id="typing-indicator" class="px-4 text-white text-xs italic h-4"></div>

    <!-- ช่องพิมพ์ข้อความ -->
    <div class="bg-gray-900 flex items-center px-3 py-2 gap-2">
      <input
        id="message-input"
        type="text"
        placeholder="Type your message..."
        class="flex-1 px-3 py-2 rounded bg-gray-700 text-white text-sm focus:outline-none"
      />
      <button id="send-btn" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded font-bold">
        ➤
      </button>
    </div>
  </div>

  <script src="/client.js"></script>
</body>
</html>
