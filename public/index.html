<!DOCTYPE html>
<html lang="th" class="h-full w-full overflow-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Minimal Chat</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Inter & Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Socket.io client library -->
  <script src="/socket.io/socket.io.js"></script>

  <style>
    :root {
      font-family: 'Plus Jakarta Sans', 'Prompt', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Prevent elastic scrolling and screen bouncing across mobile iOS/Android and desktop */
    html, body {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    /* Clean subtle scrollbar */
    #messages::-webkit-scrollbar,
    #emoji-panel::-webkit-scrollbar {
      width: 5px;
    }
    #messages::-webkit-scrollbar-track,
    #emoji-panel::-webkit-scrollbar-track {
      background: transparent;
    }
    #messages::-webkit-scrollbar-thumb,
    #emoji-panel::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 9999px;
    }
    #messages::-webkit-scrollbar-thumb:hover,
    #emoji-panel::-webkit-scrollbar-thumb:hover {
      background: #cbd5e1;
    }

    /* Subtle pulsing recording animation */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .recording-ping {
      animation: pulse-ring 1.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-100/90 text-slate-800 h-full w-full flex items-center justify-center p-0 sm:p-4 md:p-6 overflow-hidden">

  <!-- ========================= -->
  <!-- SCREEN 1: Join Chatroom   -->
  <!-- ========================= -->
  <div id="join-screen"
       class="w-full h-full sm:h-auto sm:max-w-md bg-white sm:rounded-2xl p-8 sm:p-10 shadow-sm border border-slate-200/80 flex flex-col justify-center transition-all duration-300">
    <div class="mb-8">
      <div class="w-12 h-12 rounded-xl bg-slate-900 text-white flex items-center justify-center mb-5 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-slate-900">เข้าร่วมการสนทนา</h1>
      <p class="text-sm text-slate-500 mt-1">ยินดีต้อนรับสู่ห้องแชทมินิมอลแบบเรียลไทม์</p>
    </div>

    <div class="space-y-4">
      <div>
        <label for="username-input" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">ชื่อของคุณ</label>
        <input
          id="username-input"
          type="text"
          placeholder="พิมพ์ชื่อหรือนามแฝง..."
          maxlength="24"
          autocomplete="off"
          class="w-full px-4 py-3 rounded-xl bg-slate-50 text-slate-900 border border-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-900/10 focus:border-slate-800 transition text-sm placeholder-slate-400"
        />
      </div>

      <button
        id="join-btn"
        class="w-full py-3 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 active:bg-black text-white font-medium transition shadow-sm flex items-center justify-center gap-2 group text-sm"
      >
        <span>เริ่มสนทนา</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 transition-transform group-hover:translate-x-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>

      <p id="join-error" class="text-rose-500 text-xs text-center hidden">กรุณาระบุชื่อของคุณก่อนเข้าสู่ห้องแชท</p>
    </div>
  </div>

  <!-- ========================= -->
  <!-- SCREEN 2: Chat Room       -->
  <!-- Responsive: เต็มจอในมือถือ, คอนเทนเนอร์ขนาดพอดีใน iPad & Notebook -->
  <!-- ========================= -->
  <div id="chat-screen"
       class="hidden w-full h-full sm:h-[94vh] sm:max-h-[820px] sm:max-w-2xl md:max-w-3xl lg:max-w-4xl
              bg-white sm:rounded-2xl border border-slate-200/80 shadow-sm
              flex flex-col overflow-hidden relative">

    <!-- Header -->
    <header class="bg-white border-b border-slate-100 px-4 sm:px-6 py-3.5 flex items-center justify-between shrink-0 z-10">
      <div class="flex items-center gap-3">
        <div class="relative">
          <div class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-700 font-semibold text-sm">
            💬
          </div>
          <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-500 ring-2 ring-white"></span>
        </div>
        <div>
          <h2 class="text-sm font-semibold text-slate-900">ห้องสนทนาหลัก</h2>
          <div class="flex items-center gap-1.5 text-xs text-slate-400">
            <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
            <span id="online-count">ออนไลน์: 0</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <span id="my-badge" class="hidden sm:inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600"></span>
      </div>
    </header>

    <!-- กล่องข้อความ (Scrollable ได้เฉพาะส่วนนี้ ไม่กระทบทั้งหน้าจอ) -->
    <main id="messages" class="flex-1 overflow-y-auto px-4 py-4 sm:px-6 sm:py-5 space-y-3 bg-slate-50/50 overscroll-contain"></main>

    <!-- Typing indicator -->
    <div id="typing-indicator" class="px-4 sm:px-6 text-[11px] text-slate-400 font-medium italic min-h-[1.25rem] bg-slate-50/50 flex items-center"></div>

    <!-- Emoji picker popover -->
    <div id="emoji-panel"
         class="hidden absolute bottom-20 left-4 right-4 sm:left-auto sm:right-6 sm:w-80
                bg-white border border-slate-200 rounded-2xl p-3 grid grid-cols-7 sm:grid-cols-8 gap-1.5 text-xl max-h-52 overflow-y-auto shadow-lg z-30 overscroll-contain">
    </div>

    <!-- Bottom Input Bar (Minimal Design & Clean Discord/iMessage feel) -->
    <footer class="bg-white border-t border-slate-100 p-3 sm:px-6 sm:py-3.5 shrink-0 relative z-20">
      <div class="flex items-center gap-1.5 sm:gap-2 bg-slate-100 rounded-2xl px-2 py-1.5 focus-within:bg-white focus-within:ring-2 focus-within:ring-slate-900/10 focus-within:border-slate-300 border border-transparent transition">

        <!-- ปุ่มแนบรูปภาพ (Image Upload) -->
        <button id="image-btn" type="button" title="แนบรูปภาพ" class="text-slate-500 hover:text-slate-800 p-2 rounded-xl hover:bg-slate-200/60 active:scale-95 transition flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </button>
        <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml,image/jpg" class="hidden" />

        <!-- ปุ่ม GIF (ลูกเล่นมีมสไตล์แชท) -->
        <button id="gif-btn" type="button" title="ส่งภาพ GIF" class="text-slate-500 hover:text-slate-800 px-2 py-1.5 text-xs font-bold tracking-tight rounded-xl hover:bg-slate-200/60 active:scale-95 transition">
          GIF
        </button>
        <input id="gif-input" type="file" accept="image/gif" class="hidden" />

        <!-- ปุ่ม Emoji -->
        <button id="emoji-btn" type="button" title="อีโมจิ" class="text-slate-500 hover:text-slate-800 p-2 text-lg rounded-xl hover:bg-slate-200/60 active:scale-95 transition flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </button>

        <!-- กล่องพิมพ์ข้อความ -->
        <input
          id="message-input"
          type="text"
          placeholder="พิมพ์ข้อความของคุณ..."
          autocomplete="off"
          class="flex-1 min-w-0 px-2 py-1.5 bg-transparent text-slate-800 text-sm focus:outline-none placeholder-slate-400"
        />

        <!-- ปุ่มอัดเสียง -->
        <button id="mic-btn" type="button" title="อัดเสียง" class="text-slate-500 hover:text-slate-800 p-2 rounded-xl hover:bg-slate-200/60 active:scale-95 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
          </svg>
        </button>

        <!-- ปุ่มส่งข้อความ -->
        <button id="send-btn" type="button" title="ส่งข้อความ" class="bg-slate-900 hover:bg-slate-800 active:scale-95 text-white p-2.5 rounded-xl transition shadow-sm shrink-0 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </footer>

    <!-- แถบสถานะตอนกำลังอัดเสียง (Minimal red pill indicator) -->
    <div id="recording-bar"
         class="hidden absolute bottom-16 left-4 right-4 sm:left-6 sm:right-6 bg-slate-900 text-white text-xs px-4 py-3 rounded-2xl items-center justify-between shadow-xl z-30 transition">
      <div class="flex items-center gap-2">
        <span class="relative flex h-2.5 w-2.5">
          <span class="recording-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500"></span>
        </span>
        <span class="font-medium text-slate-200">กำลังบันทึกเสียง...</span>
        <span id="record-timer" class="font-mono bg-white/10 px-2 py-0.5 rounded text-[11px] text-white">0:00</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="cancel-record-btn" type="button" class="text-slate-300 hover:text-white px-2.5 py-1 text-xs rounded-lg hover:bg-white/10 transition">ยกเลิก</button>
        <button id="stop-record-btn" type="button" class="bg-rose-500 hover:bg-rose-600 text-white px-3 py-1 text-xs font-semibold rounded-lg shadow-sm transition">ส่ง</button>
      </div>
    </div>
  </div>

  <!-- Image Lightbox Modal สำหรับแตะดูรูปขยายเต็มตา -->
  <div id="image-modal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
    <button id="close-modal-btn" class="absolute top-4 right-4 text-white/80 hover:text-white bg-white/10 hover:bg-white/20 p-2 rounded-full transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    <img id="modal-img" src="" alt="preview" class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl transition" />
  </div>

  <script src="/client.js"></script>
</body>
</html>
