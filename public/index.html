<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Instant Messaging App</title>

  <!-- Tailwind CSS ผ่าน CDN สำหรับจัดหน้าตา UI (รองรับ responsive class เช่น sm: md: lg:) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Socket.io client library -->
  <script src="/socket.io/socket.io.js"></script>

  <style>
    /* scrollbar บาง ๆ ให้ดูสวยขึ้น */
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 3px; }

    /* จุดกระพริบตอนอัดเสียง */
    @keyframes pulse-rec {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .recording-dot { animation: pulse-rec 1s infinite; }
  </style>
</head>
<body class="bg-gray-800 min-h-screen flex items-center justify-center font-sans">

  <!-- ========================= -->
  <!-- SCREEN 1: Join Chatroom   -->
  <!-- ========================= -->
  <div id="join-screen"
       class="bg-gradient-to-br from-blue-500 to-green-600 rounded-xl p-6 sm:p-8 w-[90%] max-w-xs sm:max-w-sm shadow-2xl">
    <h1 class="text-white text-xl font-bold mb-6">Join Chatroom</h1>
    <input
      id="username-input"
      type="text"
      placeholder="Username"
      class="w-full mb-4 px-3 py-2 rounded bg-gray-900 text-white border border-gray-600 focus:outline-none focus:border-green-400"
    />
    <button
      id="join-btn"
      class="w-full py-2 rounded bg-gray-900 text-white font-bold border-2 border-green-400 hover:bg-gray-700 transition"
    >
      Join
    </button>
    <p id="join-error" class="text-red-200 text-sm mt-3 hidden">กรุณากรอก Username ก่อนเข้าห้องแชท</p>
  </div>

  <!-- ========================= -->
  <!-- SCREEN 2: Chat Room       -->
  <!-- Mobile: เต็มจอ | Tablet/Desktop: การ์ดขนาดคงที่ -->
  <!-- ========================= -->
  <div id="chat-screen"
       class="hidden bg-gradient-to-br from-blue-500 to-green-600 w-full h-screen
              sm:w-[420px] sm:h-[640px] sm:rounded-xl md:w-[460px] md:h-[680px]
              shadow-2xl flex flex-col overflow-hidden relative">

    <!-- Header -->
    <div class="bg-gray-900 flex items-center justify-between px-4 py-3 shrink-0">
      <h2 class="text-white font-bold">Message</h2>
      <span id="online-count" class="text-green-400 text-xs">online: 0</span>
    </div>

    <!-- ข้อความ -->
    <div id="messages" class="flex-1 overflow-y-auto p-3 sm:p-4 space-y-2"></div>

    <!-- สถานะกำลังพิมพ์ / กำลังอัดเสียง -->
    <div id="typing-indicator" class="px-4 text-white text-xs italic h-4"></div>

    <!-- Emoji picker panel (ซ่อนอยู่ ป็อบขึ้นเหนือแถบพิมพ์) -->
    <div id="emoji-panel"
         class="hidden absolute bottom-16 left-2 right-2 sm:left-3 sm:right-3
                bg-gray-900 rounded-lg p-2 grid grid-cols-8 gap-1 text-xl max-h-40 overflow-y-auto shadow-xl z-20">
    </div>

    <!-- แถบพิมพ์ข้อความ + ปุ่มต่าง ๆ แบบ Discord -->
    <div class="bg-gray-900 flex items-center px-2 sm:px-3 py-2 gap-1 sm:gap-2 shrink-0 relative z-10">

      <!-- ปุ่มแนบไฟล์ (รูป/วิดีโอ/ไฟล์ทั่วไป) -->
      <button id="attach-btn" title="แนบไฟล์" class="text-white/80 hover:text-white p-2 text-lg">📎</button>
      <input id="file-input" type="file" accept="image/*,video/*,application/*" class="hidden" />

      <!-- ปุ่มแนบ GIF -->
      <button id="gif-btn" title="แนบ GIF" class="text-white/80 hover:text-white p-2 text-xs font-bold border border-white/30 rounded">GIF</button>
      <input id="gif-input" type="file" accept="image/gif" class="hidden" />

      <!-- ปุ่ม emoji -->
      <button id="emoji-btn" title="อีโมจิ" class="text-white/80 hover:text-white p-2 text-lg">🙂</button>

      <!-- ช่องพิมพ์ข้อความ -->
      <input
        id="message-input"
        type="text"
        placeholder="Type your message..."
        class="flex-1 min-w-0 px-3 py-2 rounded bg-gray-700 text-white text-sm focus:outline-none"
      />

      <!-- ปุ่มอัดเสียง -->
      <button id="mic-btn" title="อัดข้อความเสียง" class="text-white/80 hover:text-white p-2 text-lg">🎤</button>

      <!-- ปุ่มส่ง -->
      <button id="send-btn" class="bg-green-500 hover:bg-green-600 text-white px-3 sm:px-4 py-2 rounded font-bold shrink-0">
        ➤
      </button>
    </div>

    <!-- แถบสถานะตอนกำลังอัดเสียง -->
    <div id="recording-bar"
         class="hidden bg-red-600 text-white text-sm px-4 py-2 items-center justify-between shrink-0">
      <span>🔴 <span class="recording-dot">กำลังอัดเสียง...</span> <span id="record-timer">0:00</span></span>
      <div class="flex gap-2">
        <button id="cancel-record-btn" class="bg-black/30 px-3 py-1 rounded">ยกเลิก</button>
        <button id="stop-record-btn" class="bg-black/30 px-3 py-1 rounded font-bold">ส่ง ➤</button>
      </div>
    </div>
  </div>

  <script src="/client.js"></script>
</body>
</html>
